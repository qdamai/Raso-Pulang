<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rendang — Cooked by Time | DEV Community Challenge: Comfort Food Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:italic,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       DEV COMMUNITY FRONTEND CHALLENGE: COMFORT FOOD EDITION
       Title: Rendang — Cooked by Time
       Author: Antigravity Team
       Strict Rules: Pure HTML & CSS Art (No <img>, No <canvas>, No <svg>, No WebGL)
       ========================================================================== */
    :root {
      --color-deep-brown: #200C06;
      --color-dark-cocoa: #2F130B;
      --color-rendang-red: #9C2A1B;
      --color-burnt-terracotta: #A04028;
      --color-burnt-spice: #C86D3B;
      --color-warm-spice: #D49333;
      --color-golden-ochre: #E5A84B;
      --color-coconut-cream: #FAF5ED;
      --color-soft-rice: #FFFBF5;
      --color-banana-green: #3A7548;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-coconut-cream);
      color: var(--color-deep-brown);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Challenge Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--color-burnt-terracotta);
      display: block;
      margin-bottom: 6px;
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--color-deep-brown);
      line-height: 1.1;
    }

    .title span {
      font-style: italic;
      font-weight: 400;
      color: var(--color-burnt-spice);
    }

    .subtitle {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: var(--color-dark-cocoa);
      opacity: 0.85;
      margin-top: 6px;
    }

    /* CSS Table Surface: Woven Bamboo Mat */
    .canvas-card {
      position: relative;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 4 / 3;
      background: var(--color-soft-rice);
      border: 1px solid rgba(32, 12, 6, 0.15);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(32, 12, 6, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bamboo-texture {
      position: absolute;
      inset: 16px;
      border-radius: 20px;
      border: 1px solid rgba(200, 109, 59, 0.2);
      pointer-events: none;
      opacity: 0.8;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(200, 109, 59, 0.1) 4px, rgba(200, 109, 59, 0.1) 8px),
        repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(32, 12, 6, 0.08) 4px, rgba(32, 12, 6, 0.08) 8px);
    }

    /* 3D Scene Container */
    .scene {
      position: relative;
      width: 340px;
      height: 340px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .scene:active {
      cursor: grabbing;
    }

    /* Dynamic Shadow Floor */
    .floor-shadow {
      position: absolute;
      bottom: 24px;
      width: 300px;
      height: 160px;
      background: rgba(20, 6, 3, 0.5);
      border-radius: 50%;
      filter: blur(20px);
      pointer-events: none;
      transition: transform 0.2s ease-out;
    }

    /* 3D Rotatable Ceramic Bowl Container */
    .bowl-container {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
    }

    /* 1. CERAMIC BOWL (Pure CSS Earthenware) */
    .ceramic-bowl {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 16px;
      background: radial-gradient(circle, #FFFFFF 0%, #F5F2EB 65%, #DCD5C3 100%);
      border: 4px solid #ECE7DE;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 -8px 20px rgba(0,0,0,0.15);
    }

    .glaze-rim {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* Inner Bowl Basin & Dark Mahogany Oil Surface */
    .bowl-basin {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #1F0A04 0%, #2D120B 60%, #150602 100%);
      box-shadow: inset 0 0 35px rgba(0,0,0,0.95);
    }

    .oil-sheen {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      opacity: 0.75;
      pointer-events: none;
      background: radial-gradient(circle at 35% 35%, #5C2618 0%, #200C06 75%);
    }

    /* 2. BANANA LEAF GARNISH */
    .banana-leaf {
      position: absolute;
      top: 8px;
      right: 12px;
      width: 160px;
      height: 96px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      pointer-events: none;
      background: linear-gradient(90deg, #2D5A34 0%, #4A8B5B 50%, #22452B 100%);
      border-radius: 100px 10px 100px 10px;
      border-top: 2px solid #76B887;
      transform: translateZ(14px) rotate(16deg);
    }

    .leaf-vein-1 { width: 100%; height: 2px; background: #1A3820; margin-top: 16px; transform: rotate(6deg); }
    .leaf-vein-2 { width: 100%; height: 1px; background: rgba(104, 165, 120, 0.4); margin-top: 8px; }
    .leaf-vein-3 { width: 100%; height: 1px; background: rgba(104, 165, 120, 0.4); margin-top: 12px; }

    /* 3. RENDANG BEEF PIECES & COCONUT GRAVY TEXTURES */
    .beef-stack {
      position: relative;
      width: 224px;
      height: 224px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 20;
      transform-style: preserve-3d;
      transform: translateZ(28px);
      transition: transform 0.5s ease;
    }

    .chunk-1 {
      position: relative;
      width: 88px;
      height: 72px;
      background: linear-gradient(135deg, #3B2210 0%, #2C1608 60%, #1A0A03 100%);
      border-radius: 28px 14px 35px 20px;
      border: 2px solid #522C16;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15), 0 8px 16px rgba(0,0,0,0.6);
      transform: translateZ(18px) rotate(-6deg);
    }

    .crumb-1 { position: absolute; top: 4px; left: 8px; right: 8px; height: 20px; background: #7A4522; border-radius: 50%; filter: blur(0.5px); }
    .crumb-2 { position: absolute; top: 8px; left: 12px; right: 12px; height: 12px; background: #A36033; border-radius: 50%; }

    .chunk-2 {
      position: relative;
      width: 80px;
      height: 64px;
      background: linear-gradient(135deg, #331A0B 0%, #241004 70%, #120401 100%);
      border-radius: 16px 30px 20px 26px;
      border: 2px solid #48230D;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      transform: translateZ(24px) rotate(14deg);
      margin-left: -16px;
    }

    .chunk-3 {
      position: relative;
      width: 72px;
      height: 60px;
      background: linear-gradient(135deg, #422612 0%, #2B1507 70%, #150802 100%);
      border-radius: 24px 18px 30px 14px;
      border: 2px solid #5C3218;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      transform: translateZ(30px) rotate(-16deg);
      margin-top: -20px;
    }

    .chunk-4 {
      position: relative;
      width: 96px;
      height: 64px;
      background: linear-gradient(135deg, #2D1609 0%, #1D0A03 70%, #0E0301 100%);
      border-radius: 20px 26px 16px 32px;
      border: 2px solid #421D0A;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      transform: translateZ(36px) rotate(4deg);
      margin-top: -12px;
    }

    /* 4. CHILI & HERB GARNISHES */
    .chili-red-1 {
      position: absolute;
      top: 24px;
      left: 32px;
      width: 56px;
      height: 16px;
      background: linear-gradient(90deg, #C83726 0%, #E04533 50%, #8C1E12 100%);
      border-radius: 50px;
      border: 1px solid #FFAAA0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transform: translateZ(48px) rotate(-28deg);
    }
    .stem { width: 10px; height: 6px; background: #4A8B5B; border-radius: 50%; margin-left: -2px; margin-top: 4px; }

    .chili-red-2 {
      position: absolute;
      top: 48px;
      left: 20px;
      width: 44px;
      height: 14px;
      background: linear-gradient(90deg, #C83726 0%, #E04533 50%, #9C2A1B 100%);
      border-radius: 50px;
      border: 1px solid #FFAAA0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transform: translateZ(52px) rotate(16deg);
    }

    .chili-yellow {
      position: absolute;
      top: 32px;
      left: 72px;
      width: 44px;
      height: 14px;
      background: linear-gradient(90deg, #E5A84B 0%, #FFC05B 50%, #C88426 100%);
      border-radius: 50px;
      border: 1px solid #FFE8B8;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transform: translateZ(55px) rotate(36deg);
    }

    /* 5. ANIMATED STEAM */
    @keyframes floatSteam {
      0% { opacity: 0.1; transform: translateY(0px) scale(0.95); }
      50% { opacity: 0.35; transform: translateY(-24px) scale(1.08); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }

    .steam-1 {
      position: absolute;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
      animation: floatSteam 7s ease-in-out infinite;
      z-index: 40;
    }

    .steam-2 {
      position: absolute;
      width: 96px;
      height: 96px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      filter: blur(14px);
      pointer-events: none;
      animation: floatSteam 8s ease-in-out 3.5s infinite;
      z-index: 40;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--color-burnt-terracotta);
      font-style: italic;
    }

    .tech-stack {
      margin-top: 6px;
      font-size: 11px;
      font-family: monospace;
      color: rgba(47, 19, 11, 0.6);
      text-align: center;
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .steam-1, .steam-2 { animation: none !important; opacity: 0.2; }
      .bowl-container, .floor-shadow { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="badge">DEV Community Challenge: Comfort Food Edition</span>
    <h1 class="title">Rendang — <span>Cooked by Time</span></h1>
    <p class="subtitle">&ldquo;A celebration of patience, culture, craftsmanship, and home served inside a CSS bowl.&rdquo;</p>
  </div>

  <div class="canvas-card">
    <div class="bamboo-texture"></div>

    <div class="scene" id="scene">
      <div class="floor-shadow" id="shadow"></div>

      <div class="bowl-container" id="bowl">
        <div class="ceramic-bowl">
          <div class="glaze-rim"></div>
          <div class="bowl-basin">
            <div class="oil-sheen"></div>

            <!-- Daun Pisang Murni CSS -->
            <div class="banana-leaf">
              <div class="leaf-vein-1"></div>
              <div class="leaf-vein-2"></div>
              <div class="leaf-vein-3"></div>
            </div>

            <!-- Daging Rendang Murni CSS -->
            <div class="beef-stack" id="beefStack">
              <div class="chunk-1"><div class="crumb-1"></div><div class="crumb-2"></div></div>
              <div class="chunk-2"><div class="crumb-1"></div></div>
              <div class="chunk-3"></div>
              <div class="chunk-4"></div>

              <!-- Hiasan Cabai Murni CSS -->
              <div class="chili-red-1"><div class="stem"></div></div>
              <div class="chili-red-2"><div class="stem"></div></div>
              <div class="chili-yellow"><div class="stem"></div></div>
            </div>

            <!-- Uap Asap Murni CSS -->
            <div class="steam-1"></div>
            <div class="steam-[#FAF5ED] steam-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="footer-note">&ldquo;Hover over the bowl for 3D depth • Click to gently stir the Rendang&rdquo;</p>
  <p class="tech-stack">Pure HTML5 &amp; CSS3 Artwork • Zero Images • Zero SVGs • Zero WebGL</p>

  <script>
    const scene = document.getElementById('scene');
    const bowl = document.getElementById('bowl');
    const shadow = document.getElementById('shadow');
    const beefStack = document.getElementById('beefStack');

    let currentX = 15;
    let currentY = -10;

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      currentX = -y * 24;
      currentY = x * 24;

      updateTransform();
    });

    scene.addEventListener('mouseleave', () => {
      currentX = 15;
      currentY = -10;
      updateTransform();
    });

    scene.addEventListener('click', () => {
      beefStack.style.transform = 'translateZ(28px) rotate(14deg)';
      bowl.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg) scale(0.94)`;
      
      setTimeout(() => {
        beefStack.style.transform = 'translateZ(28px) rotate(0deg)';
        updateTransform();
      }, 500);
    });

    function updateTransform() {
      bowl.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg) scale(1)`;
      shadow.style.transform = `translate(${currentY * -1.5}px, ${currentX * -1.5}px) scale(${1 + Math.abs(currentY)/100})`;
    }

    updateTransform();
  </script>
</body>
</html>
